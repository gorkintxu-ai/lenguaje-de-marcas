<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ejercicio 3</title>

    <link rel="stylesheet" href="CSS/ejercicio3.css">
</head>

<body>

    <!-- TABLA 1 -->

    <table class="tabla1">

        <caption>
            Tabla prueba 1
        </caption>

        <tr>
            <th>columna 1</th>
            <th>columna 2</th>
            <th>columna 3</th>
            <th>columna 4</th>
        </tr>

        <tr>
            <td>col1</td>

            <!-- Une dos columnas -->
            <td colspan="2">
                col2
            </td>

            <!-- Une dos filas -->
            <td rowspan="2">
                col3
            </td>
        </tr>

        <tr>
            <td>colum1</td>
            <td>colum2</td>
            <td>colum4</td>
        </tr>

    </table>


    <!-- TABLA 2 -->

    <table class="tabla2">

        <caption>
            Tabla prueba 2
        </caption>

        <tr>
            <th>columna 1</th>
            <th>columna 2</th>
            <th>columna 3</th>
            <th>columna 4</th>
        </tr>

        <tr>
            <td class="verde">
                col1
            </td>

            <td class="verde" colspan="2">
                col2
            </td>

            <td class="verde">
                col3
            </td>
        </tr>

        <tr>
            <td class="gris">
                colum1
            </td>

            <td class="gris" rowspan="2">
                colum2
            </td>

            <td class="gris">
                colum3
            </td>

            <td class="gris">
                colum4
            </td>
        </tr>

        <tr>
            <td class="verde">
                column1
            </td>

            <td class="verde">
                column3
            </td>

            <td class="verde">
                column4
            </td>
        </tr>

        <tr>
            <td class="gris">
                colu1
            </td>

            <td class="gris">
                colu2
            </td>

            <td class="gris">
                colu3
            </td>

            <td class="gris">
                colu4
            </td>
        </tr>

    </table>

</body>
</html>
